name: 构建并发布 Docker 镜像
run-name: 发布 Docker 镜像：${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的私有源码 Tag，例如 v0.1.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/davidzhang12138/auto-check-in
  SOURCE_REPO: davidzhang12138/auto-check-in
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build-and-push:
    name: 构建多架构镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 校验版本 Tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "无效的版本 Tag：$RELEASE_TAG" >&2
            exit 1
          fi

      - name: 检出指定私有源码 Tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 记录源码版本
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$source_sha" != "$checkout_sha" ]]; then
            echo "检出提交与 Tag 不一致：$checkout_sha != $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          printf '源码 Tag：`%s`\n\n源码提交：`%s`\n' "$RELEASE_TAG" "$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.SOURCE_REPO }}/releases/tag/${{ env.RELEASE_TAG }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: 构建并推送多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          no-cache: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            COMMIT=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}

      - name: 在私有源码仓库创建 Release 标记
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          {
            printf '## Docker 镜像\n\n'
            printf -- '- 版本：`%s`\n' "$RELEASE_TAG"
            printf -- '- 镜像：`%s:%s`\n' "$IMAGE_NAME" "$RELEASE_TAG"
            printf -- '- 多架构摘要：`%s`\n' "$IMAGE_DIGEST"
            printf -- '- 源码提交：`%s`\n' "$SOURCE_SHA"
            printf -- '- 平台：`linux/amd64`、`linux/arm64`\n\n'
            printf '镜像由公开仓库 [auto-check-in-Releases](https://github.com/%s) 的自动化构建发布。\n' "$GITHUB_REPOSITORY"
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$SOURCE_REPO" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$SOURCE_REPO" \
              --target main \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
