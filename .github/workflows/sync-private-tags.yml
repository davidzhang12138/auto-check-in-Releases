name: 同步私有仓库版本
run-name: 同步私有 Tag${{ inputs.tag && format('：{0}', inputs.tag) || '' }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 可选；立即发布指定的私有源码 Tag，例如 v0.1.1
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: sync-private-tags
  cancel-in-progress: false

env:
  SOURCE_REPO: davidzhang12138/auto-check-in
  MINIMUM_AUTOMATIC_TAG: v0.1.1

jobs:
  dispatch-release:
    name: 检查并触发发布
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 校验手动输入
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG//[[:space:]]/}"
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "无效的版本 Tag：$tag" >&2
            exit 1
          fi

      - name: 检出私有源码仓库
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 选择尚未发布的 Tag
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          requested_tag="${REQUESTED_TAG//[[:space:]]/}"
          published_tags="$(GH_TOKEN="$SOURCE_TOKEN" gh api --paginate "repos/${SOURCE_REPO}/releases" --jq '.[].tag_name')"
          active_titles="$(
            gh api "repos/${RELEASE_REPO}/actions/workflows/docker-image.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status != "completed") | .display_title'
          )"

          is_published() {
            grep -Fxq -- "$1" <<< "$published_tags"
          }

          is_active() {
            grep -Fxq -- "发布 Docker 镜像：$1" <<< "$active_titles"
          }

          tag=""
          if [[ -n "$requested_tag" ]]; then
            git rev-parse --verify --quiet "refs/tags/${requested_tag}^{commit}" >/dev/null || {
              echo "私有仓库中不存在 Tag：$requested_tag" >&2
              exit 1
            }
            if is_active "$requested_tag"; then
              echo "Tag $requested_tag 已有发布任务运行或排队，本次不重复触发"
            else
              tag="$requested_tag"
            fi
          else
            if [[ -n "$active_titles" ]]; then
              echo "已有镜像发布任务运行或排队，本次自动检查不再追加任务"
            else
              while IFS= read -r candidate; do
                [[ -n "$candidate" ]] || continue
                newest="$(printf '%s\n%s\n' "$MINIMUM_AUTOMATIC_TAG" "$candidate" | sort -V | tail -n 1)"
                [[ "$newest" == "$candidate" ]] || continue
                is_published "$candidate" && continue
                tag="$candidate"
                break
              done < <(git tag --list 'v*' --sort=-version:refname)
            fi
          fi

          if [[ -z "$tag" ]]; then
            echo "没有需要触发的版本"
            echo 'dispatch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          echo "选择版本 $tag，源码提交 $source_sha"
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '已选择 `%s`（`%s`）进入公开发布流程。\n' "$tag" "$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: 触发公开发布
        if: steps.select.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run docker-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$RELEASE_TAG"
